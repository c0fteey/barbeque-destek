# Her push'ta Windows exe'si derlenir, testler çalışır ve çalıştırmaya hazır dosyalar "yayin" dalına konur
# (tek commit'lik, her seferinde baştan yazılan dal; repo şişmez). bbq-deploy panelinde destek botunun branch'i
# "yayin" olunca ajan oradan kurar: git pull + npm ci + node baslat.js (VDS'e Rust kurmak gerekmez).
name: Yayın

on:
  push:
    branches: [main, rust]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yayin
  cancel-in-progress: true

jobs:
  derle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Derle
        run: cargo build --release

      - name: Yayın dalına koy
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mesaj="$(git log -1 --format=%s)"
          mkdir yayin
          cp target/release/barbeque-destek.exe baslat.js package.json package-lock.json README.md .env.example yayin/
          cp -r ayarlar yayin/
          printf 'node_modules/\n.env\nveri/\n' > yayin/.gitignore
          cd yayin
          git init -q -b yayin
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${GITHUB_REF_NAME}@${GITHUB_SHA::7}: ${mesaj}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" yayin
